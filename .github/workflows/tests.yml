name: Tests

on:
  push:
    branches:
      - master
      - release-*
      - rhoai-staging
  pull_request:
    branches:
      - master
      - release-*
      - rhoai-staging

env:
  POETRY_VERSION: 2.1.1

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        target: ["dataplane", "model-repository"]
    runs-on: ubuntu-24.04
    steps:
      # Pinned from actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python ${{ matrix.python-version }}
        # Pinned from actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        # Pinned from snok/install-poetry v1.4.1
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false
      - name: Install dependencies
        run: poetry sync --only dev
      - name: Generate ${{ matrix.target }}
        run: make generate-${{ matrix.target }}
      - name: Check for changes
        run: make lint-no-changes

  lint:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-24.04
    steps:
      # Pinned from actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Python ${{ matrix.python-version }}
        # Pinned from actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        # Pinned from snok/install-poetry v1.4.1
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false
      - name: Install dependencies
        run: poetry sync --only dev
      - name: Lint
        run: make lint

  test-mlserver:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          # - macos-13
        python-version: ["3.10", "3.11", "3.12"]
        tox-env:
          - mlserver-conda
          - mlserver-venv
          - mlserver-venv-zmq
        is-pr:
          - ${{ github.event_name == 'pull_request' }}
        exclude:
          # MacOS tests take a lot of time, so we will run them only on merge
          # From https://github.com/orgs/community/discussions/26253
          - is-pr: true
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned from actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Docker (missing on MacOS)
        if: runner.os == 'macos'
        run: ./hack/install-docker-macos.sh
      - name: Install OpenMP (in MacOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Set up Python ${{ matrix.python-version }}
        # Pinned from actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Miniconda
        if: contains(matrix.tox-env, 'conda')
        # Pinned from conda-incubator/setup-miniconda v3.3.0
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167
        with:
          auto-update-conda: true
          auto-activate-base: false
      - name: Install Poetry
        # Pinned from snok/install-poetry v1.4.1
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false
      - name: Install dependencies
        run: poetry install --only test
      - name: Test
        run: |
          if [[ ${{ runner.os == 'macOS' }} ]]; then
            source ./hack/activate-libomp-macos.sh
          fi
          poetry run tox -e ${{ matrix.tox-env }}

  test-runtimes:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          # - macos-13
        python-version: ["3.10", "3.11", "3.12"]
        tox-environment:
          - sklearn
          - xgboost
          - lightgbm
          - onnx
        is-pr:
          - ${{ github.event_name == 'pull_request' }}
        exclude:
          # MacOS tests take a lot of time, so we will run them only on merge
          # From https://github.com/orgs/community/discussions/26253
          - is-pr: true
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned from actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install OpenMP (in MacOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Set up Python ${{ matrix.python-version }}
        # Pinned from actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        # Pinned from snok/install-poetry v1.4.1
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false
      - name: Install dependencies
        run: poetry install --only test
      - name: Test
        run: |
          if [[ ${{ runner.os == 'macOS' }} ]]; then
            source ./hack/activate-libomp-macos.sh
          fi
          poetry run tox -c ./runtimes/${{ matrix.tox-environment }}

  # Ensure that having all the runtimes installed together works
  test-all-runtimes:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          # - macos-12
        python-version: ["3.10", "3.11", "3.12"]
        tox-env:
          - all-runtimes-conda
          - all-runtimes-venv
          - all-runtimes-venv-zmq
        is-pr:
          - ${{ github.event_name == 'pull_request' }}
        exclude:
          # Keep the existing push-only conda policy; both venv variants run
          # before merge on every supported Python version.
          - is-pr: true
            tox-env: all-runtimes-conda
    runs-on: ${{ matrix.os }}
    steps:
      - name: Maximize build space
        if: runner.os == 'Linux'
        # Pinned from easimon/maximize-build-space v10
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          overprovision-lvm: 'true'
          swap-size-mb: 1024
      # Pinned from actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Docker (missing on MacOS)
        if: runner.os == 'macOS'
        run: ./hack/install-docker-macos.sh
      - name: Downgrade OpenMP (in MacOS)
        if: runner.os == 'macos'
        run: |
          # Recent versions of OpenMP cause segfaults in MacOS when training
          # LightGBM / XGBoost models (but only when Torch is present)
          # https://github.com/microsoft/LightGBM/issues/4229
          # https://github.com/autogluon/autogluon/issues/1442
          wget https://raw.githubusercontent.com/chenrui333/homebrew-core/0094d1513ce9e2e85e07443b8b5930ad298aad91/Formula/libomp.rb
          brew unlink libomp
          brew install --build-from-source ./libomp.rb
          brew list --version libomp
      - name: Set up Python ${{ matrix.python-version }}
        # Pinned from actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Miniconda
        if: contains(matrix.tox-env, 'conda')
        # Pinned from conda-incubator/setup-miniconda v3.3.0
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167
        with:
          auto-update-conda: true
          auto-activate-base: false
      - name: Install Poetry
        # Pinned from snok/install-poetry v1.4.1
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: false
      - name: Install dependencies
        run: poetry install --only test
      - name: Test
        run: |
          if [[ ${{ runner.os == 'macOS' }} ]]; then
            source ./hack/activate-libomp-macos.sh
          fi
          poetry run tox -e ${{ matrix.tox-env }}

  test-results:
    name: Test results
    if: ${{ always() }}
    needs: [generate, lint, test-mlserver, test-runtimes, test-all-runtimes]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test matrix to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          failed = {
              name: job["result"]
              for name, job in results.items()
              if job["result"] != "success"
          }
          if failed:
              raise SystemExit(f"Required jobs did not succeed: {failed}")
          PY
