[tool.poetry]
name = "mlserver"
version = "1.7.0.dev0"
description = "MLServer"
authors = ["Seldon Technologies Ltd. <hello@seldon.io>"]
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Operating System :: POSIX",
    "Operating System :: MacOS"
]
include =  ["mlserver/rest/openapi/*.json"]

[tool.poetry.scripts]
mlserver = 'mlserver.cli:main'

[tool.black]
exclude = '''
(
  mlserver\.egg-info
  | \.mypy_cache
  | \.git
  | \.tox
  | dist
  | venv
)
'''

[tool.mypy]
ignore_missing_imports = true
plugins = "pydantic.mypy"
exclude = [
  'mlserver\.egg-info',
  '\.mypy_cache',
  '\.git',
  '\.tox',
  'dist',
  'venv',
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = ["cuda: marks tests requiring CUDA GPU hardware (auto-skipped without GPU)"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
click = "*"
fastapi = ">=0.134.0,<0.137.0"
python-dotenv = "*"
grpcio = ">=1.67.1"
numpy = "*"
pandas = "*"
protobuf = ">=5.27.2,<7.0.0"
uvicorn = "*"
starlette = ">=1.3.1"
starlette-exporter = "*"
py-grpc-prometheus = "*"
# add a min version to tritonclient due to https://github.com/triton-inference-server/server/issues/6246
tritonclient = {version = ">=2.42", extras = ["http"]}
# keep a min version for geventhttpclient to avoid compatibility regressions
geventhttpclient = ">=2.1.1"
aiohttp = ">=3.14.3,<4"
urllib3 = ">=2.7.0"
gevent = "*"
aiofiles = "*"
orjson = "*"
uvloop = {version = "*", markers = "sys_platform != 'win32' and (sys_platform != 'cygwin' and platform_python_implementation != 'PyPy')"}
pydantic = "^2.7.1"
pydantic-settings = "^2.3.0"
python-multipart = ">=0.0.31,<0.0.33"
pyzmq = {version = "27.2.0", optional = true}

opentelemetry-sdk = "^1.22.0"
opentelemetry-instrumentation-fastapi = ">=0.43b0"
opentelemetry-instrumentation-grpc = ">=0.43b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.22.0"

[tool.poetry.group.test.dependencies]
tox = "4.16.0"

[tool.poetry.group.dev.dependencies]
datamodel-code-generator = "0.56.0"
grpcio-tools = ">=1.67.1"
pytest = "7.4.4"
pytest-asyncio = "0.21.1"
pytest-mock = "3.12.0"
pytest-cases = "3.8.5"
pytest-lazy-fixture = "^0.6.3"
tox = "4.16.0"
docker = "7.1.0"
aiohttp = "3.14.3"
aiohttp-retry = "2.8.3"
## Used for FastAPI Async testing
httpx = "0.27.0"
tenacity = "8.4.1"
pyyaml = "6.0.1"
conda-pack = "0.7.1"
flake8 = "7.0.0"
flake8-black = "0.3.6"
mypy = "1.11.2"
mypy-protobuf = "3.6.0"
types-protobuf = "5.26.0.20240422"
types-orjson = "3.6.2"
types-aiofiles = "24.1.0.20250516"
types-requests = "2.32.0.20250602"
black = "24.8.0"
pip-licenses = "4.4.0"
pytest-xdist = "3.6.1"
filelock = "^3.13.1"
httpx-sse = ">=0.3.1,<0.5.0"

[tool.poetry.group.docker.dependencies]
tensorflow = "^2.16"

[tool.poetry.group.odh-runtimes]
optional = true

[tool.poetry.group.odh-runtimes.dependencies]
mlserver-sklearn = {path = "./runtimes/sklearn", develop = true}
mlserver-xgboost = {path = "./runtimes/xgboost", develop = true}
mlserver-lightgbm = {path = "./runtimes/lightgbm", develop = true}
mlserver-onnx = {path = "./runtimes/onnx", develop = true, extras = ["cpu"]}

[tool.poetry.group.odh-runtimes-cuda]
optional = true

[tool.poetry.group.odh-runtimes-cuda.dependencies]
mlserver-onnx = {path = "./runtimes/onnx", develop = true, extras = ["cuda"]}

[tool.poetry.group.odh-runtimes-cuda-dev]
optional = true

[tool.poetry.group.odh-runtimes-cuda-dev.dependencies]
nvidia-cuda-nvrtc-cu12 = "~=12.0"
nvidia-cuda-runtime-cu12 = "~=12.0"
nvidia-cublas-cu12 = "~=12.0"
nvidia-cufft-cu12 = "~=11.0"
nvidia-curand-cu12 = "~=10.0"
nvidia-cusolver-cu12 = "~=11.0"
nvidia-cusparse-cu12 = "~=12.0"
nvidia-nvjitlink-cu12 = "~=12.0"
nvidia-cudnn-cu12 = "~=9.0"

[tool.poetry.group.all-runtimes]
optional = true

[tool.poetry.group.all-runtimes.dependencies]
mlserver-sklearn = {path = "./runtimes/sklearn", develop = true}
mlserver-xgboost = {path = "./runtimes/xgboost", develop = true}
mlserver-lightgbm = {path = "./runtimes/lightgbm", develop = true}
mlserver-onnx = {path = "./runtimes/onnx", develop = true, extras = ["cpu"]}

[tool.poetry.group.all-runtimes-dev]
optional = true

[tool.poetry.group.all-runtimes-dev.dependencies]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "6.2.1"
sphinx_material = "0.0.36"
readthedocs-sphinx-search = "0.3.2"
myst-parser = "2.0.0"
sphinxcontrib-bibtex = "2.5.0"
autodoc_pydantic = "^2.2.0"
sphinx-click = "6.0.0"
sphinx_design = "0.4.1"
sphinx-autobuild = "2024.4.16"
sphinx-copybutton = "^0.5.2"

[tool.poetry.extras]
zmq = ["pyzmq"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
