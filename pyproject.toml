[tool.poetry]
name = "mlserver-performance-resources"
version = "0.1.0"
description = "Model preparation and manual benchmarks for MLServer performance review"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
mlserver = {path = "../MLServer", develop = true, extras = ["zmq"]}
mlserver-onnx = {path = "../MLServer/runtimes/onnx", develop = true, extras = ["cuda"]}
numpy = "2.2.6"
onnx = "1.21.0"
onnxruntime-gpu = {version = "1.23.2", extras = ["cuda", "cudnn"]}

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-asyncio = "0.21.1"
pytest-xdist = "3.6.1"
black = "24.8.0"
flake8 = "7.0.0"
mypy = "1.11.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = [".", "model-preparation"]
testpaths = ["benchmarking/tests", "model-preparation/tests"]

[tool.mypy]
ignore_missing_imports = true
