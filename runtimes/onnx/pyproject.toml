[tool.poetry]
name = "mlserver-onnx"
version = "1.7.0.dev0"
description = "ONNX runtime for MLServer"
authors = [
    "Syed Nomaan Ali (Snomaan6846) <nomaan.syed.ali@gmail.com>",
    "Syed Nomaan Ali (Red Hat, Inc.) <syedali@redhat.com>",
]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "mlserver_onnx"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
mlserver = "*"
# >=1.21.0 required for opset 21 support used by onnxruntime >=1.20.0
onnx = ">=1.21.0"
onnxruntime = {version = "==1.25.0", optional = true}
onnxruntime-gpu = {version = "==1.25.0", optional = true}

[tool.poetry.extras]
cpu = ["onnxruntime"]
cuda = ["onnxruntime-gpu"]

[tool.poetry.group.dev.dependencies]
mlserver = {path = "../..", develop = true}
onnxruntime = "==1.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

